# UNCAGED Index Relay + OpenSearch, single-node deployment.
#
#   docker compose up
#
# The relay auto-generates a signing key on first run (printed once in the
# logs, persisted in ./relay-data). Set NOSTR_NSEC to override.
#
# The relay is reachable at ws://localhost:13131 (NIP-11 document at
# http://localhost:13131 with Accept: application/nostr+json, health at
# /healthz) and Prometheus metrics at http://localhost:13131/metrics.
#
# For production, put a TLS-terminating reverse proxy in front, enable
# OpenSearch auth/TLS, and size shards/heap to your index.

services:
  # One-shot: chown the data dirs to uid 1000 (OpenSearch refuses root;
  # named volumes are root-owned by default). Uses the same layout as the
  # Umbrel compose so data is interchangeable.
  init-permissions:
    image: alpine:3
    restart: "no"
    volumes:
      - opensearch-data:/opensearch-data
      - relay-data:/relay-data
    command: chown -R 1000:1000 /opensearch-data /relay-data

  opensearch:
    image: opensearchproject/opensearch:2
    restart: unless-stopped
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - NO_PROXY=*
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  relay:
    build: .
    # Prefer the published image once it exists:
    # image: ghcr.io/nostrdanish/uncaged-index-relay:latest
    restart: unless-stopped
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    ports:
      - "13131:13131"
    environment:
      PORT: "13131"
      RELAY_URL: ${RELAY_URL:-ws://localhost:13131/}
      RELAY_PUBKEY: ${RELAY_PUBKEY:-}
      RELAY_CONTACT: ${RELAY_CONTACT:-}
      NOSTR_NSEC: ${NOSTR_NSEC:-}
      RELAY_DATA_DIR: /app/data
      OPENSEARCH_NODE: http://opensearch:9200
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-nostr-events}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # UNCAGED index specialization (see .env.example)
      UNCAGED_DOMAINS: ${UNCAGED_DOMAINS:-*}
      UNCAGED_SCOPE: ${UNCAGED_SCOPE:-global}
      UNCAGED_LANGUAGES: ${UNCAGED_LANGUAGES:-}
      UNCAGED_DOC_TYPES: ${UNCAGED_DOC_TYPES:-}
    volumes:
      - relay-data:/app/data

volumes:
  opensearch-data:
  relay-data:
